# Redaction service configuration. Every field has a code default, so you may
# delete any of these; the values below are the committed defaults.

[engine]
# The two axes combine freely.
ocr_backend = "onnxruntime"  # paddle | onnxruntime — the inference engine for every
                             # paddle model on the page: OCR detection, recognition, layout.
classifier = "presidio"      # presidio | guard-omni — the default for ?classifier=
guard_omni = false           # offer guard-omni (needs `uv sync --group guard-omni`)
# Minimum mean detector score for a text box; PaddleOCR's own default is 0.6.
# Because it is a mean over the box, a full-width line of small type dilutes it —
# an imprint footer scored just under 0.6 and was not detected at all. Raise it if
# background texture is being read as text.
det_box_thresh = 0.5

[redaction]
fill = [0, 0, 0]           # black
padding = 2                # pixels added around each OCR line box
score_threshold = 0.4      # Presidio minimum entity score
unwarp = false              # flatten the page before OCR (default for ?unwarp=)
pdf_dpi = 200              # rasterization DPI for uploaded PDFs (default for ?pdf-dpi=)
max_pages = 30             # reject PDFs with more pages than this
jpeg_quality = 90          # output quality (visually lossless, default for ?jpeg-quality=)
redact_regions = true      # also blacken whole detected layout regions
# The whole-region pass. A trained layout detector (PP-DocLayout) finds typed
# regions on the page; `image`, `seal`, `footer`, `footnote` and `aside_text` are
# blackened on sight — that includes a payment QR code, which the detector
# reports as an `image`. Every other region only shapes the reading order.
# Which model and how sure it has to be; *what it runs on* is [engine] above.
[redaction.layout]
model_name = "PP-DocLayout_plus-L"
# Under the model's own 0.5 default: phone photos depress every score, and a
# fee table that scores 0.9+ on a scan scores 0.38-0.43 photographed.
threshold = 0.35
layout_nms = true          # prune the near-duplicate boxes a low threshold lets through

[api]
max_upload_bytes = 31457280          # 30 MiB — covers PDF uploads + /api/assemble payloads
input_content_types = ["image/png", "image/jpeg", "application/pdf"]
max_image_pixels = 40000000          # decompression-bomb guard (~40 MP), per page
max_concurrent_per_worker = 1        # in-flight redactions per worker
