name: Docker build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The provenance attestation (build-push-action default) wraps the
          # single-arch image in an OCI *index*, and GHCR's UI reads the
          # description/licenses from index annotations — never from the image
          # config labels the Dockerfile sets. So annotations must be emitted at
          # index level too, or the package page shows nothing.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Both overridden rather than auto-derived: the *image* license is AGPL
          # because it bundles PyMuPDF (see LICENSE.md) — not the repo's MIT — and
          # the description must match the Dockerfile LABEL. Applied to labels and
          # annotations alike so config and index never disagree.
          labels: |
            org.opencontainers.image.description=Removes PII from German invoices. FastAPI service with bundled web UI and REST API; all models baked in, runs fully offline.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.description=Removes PII from German invoices. FastAPI service with bundled web UI and REST API; all models baked in, runs fully offline.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # amd64 only: paddlepaddle ships no linux-arm64 wheel (see Dockerfile).
      # ubuntu-latest runners are already amd64, so this build never needs qemu.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
