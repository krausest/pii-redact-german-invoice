name: Run tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-latest is amd64, so paddle OCR inference runs natively — no qemu
      # (paddle inference is broken under qemu, see CLAUDE.md).
      - name: Set up uv
        # v7+ runs on node24; v6 is node20 (deprecated, removed from runners
        # 2026-09-16). No floating v8/v9 major tag exists, so pin the release.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -m 'not slow'
