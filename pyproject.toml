[project]
name = "pii-redact-german-invoice"
version = "0.1.0"
description = "Tries to remove personal information from german invoices"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "de-core-news-lg",
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "onnxruntime>=1.19.0",
    # backend.codes uses cv2's QR detector for the outline of a code too coarse to
    # decode. paddleocr pulls it in anyway (paddlex pins ==4.10.0.84); declared
    # because we import it directly. Must be the *contrib* build —
    # QRCodeDetectorAruco is not in the base package.
    "opencv-contrib-python>=4.10",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "presidio-analyzer>=2.2.0",
    # Config + request validation. FastAPI pulls it in anyway; declared because
    # backend.config and backend.options import it directly.
    "pydantic>=2.9.0",
    "pymupdf>=1.28.0",
    "uvicorn[standard]>=0.34.0",
    # QR + DataMatrix detection (backend.codes), and the encoder tests/test_codes.py
    # builds its fixtures with. Apache-2.0 and a self-contained abi3 wheel, unlike
    # pylibdmtx (LGPL libdmtx + an apt line in the Dockerfile).
    "zxing-cpp>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project.scripts]
pii-redact = "backend.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    # Jupyter notebooks (dev only, not the runtime service). The notebooks call the
    # API with requests.post; nothing in `backend` imports it.
    "ipykernel>=7.3.0",
    "requests>=2.34.2",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that load real ML models (deselect with -m 'not slow')",
    "regression: OCR-replay snapshots; opt in with --regression (loads the classifier)",
]

[tool.uv.sources]
de-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl" }
